apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/forgetdev/platform-gitops-lab.git'
    targetRevision: HEAD
    path: apps/echo-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: echo-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
