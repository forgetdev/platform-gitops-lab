apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-service
  namespace: default
  labels:
    app: dns-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns-service
  template:
    metadata:
      labels:
        app: dns-service
    spec:
      serviceAccountName: dns-service-sa
      terminationGracePeriodSeconds: 15
      containers:
        # Container 1: Servidor DNS autoritativo e API REST
        - name: dnsd
          image: dnsd:2.0
          imagePullPolicy: Never
          args:
            - "-port"
            - "53"
            - "-http-port"
            - "8081"
            - "-zone-file"
            - "/data/records.json"
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: http-api
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /records
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /records
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /records
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dns-storage
              mountPath: /data

        # Container 2: Sidecar Ingress Watcher
        - name: ingress-watcher
          image: docker.io/library/ingress-watcher:1.4
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: dns-watcher-config
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        - name: dns-storage
          persistentVolumeClaim:
            claimName: dns-data-pvc
