apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns-service-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: dns.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-service
                port:
                  number: 8081
