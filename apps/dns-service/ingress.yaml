apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns-service-ingress
  namespace: default
spec:
  rules:
    - host: dns.totalip.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-service
                port:
                  number: 8081
